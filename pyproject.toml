[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bellwether"
version = "0.1.0"
description = "Reliability layer for multi-modal model serving: shadow canaries, data contracts, drift detection and SLO burn-rate gating."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Drashti Shah" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "grpcio>=1.85",
  "protobuf>=7.35",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.24"]
dev = ["pytest>=8", "ruff>=0.5", "grpcio-tools>=1.85"]

[project.scripts]
bellwether-analyzer = "bellwether.analyzer.__main__:main"
bellwether-modelserver = "bellwether.modelserver.__main__:main"
bellwether-models = "bellwether.models.build:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bellwether = ["contracts/*.yaml", "v1/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: needs a PostgreSQL server (set BELLWETHER_TEST_PG_URL)",
  "slow: longer statistical tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/bellwether/v1"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
