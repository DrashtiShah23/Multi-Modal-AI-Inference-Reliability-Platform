# Gate a shadow canary on two independent signals:
#   * analyzer-verdict: Bellwether's paired comparison (embedding agreement,
#     similarity error, latency, error budget burn, contract violations).
#     Any ROLLBACK fails the analysis immediately. HOLD (still collecting) is
#     inconclusive; the candidate must reach PROMOTE within the soak window.
#   * candidate-error-burn: Prometheus view of the candidate's 5xx ratio as a
#     multiple of the 0.1% error budget, from the gateway's own counters.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bellwether-shadow-canary
spec:
  args:
    - name: candidate-version
    - name: model
      value: multimodal
  metrics:
    - name: analyzer-verdict
      interval: 1m
      count: 15
      failureLimit: 0
      inconclusiveLimit: 14
      successCondition: result == "PROMOTE"
      failureCondition: result == "ROLLBACK"
      provider:
        web:
          url: "http://bellwether-analyzer.bellwether.svc.cluster.local:8010/v1/models/{{args.model}}/canary/{{args.candidate-version}}/verdict"
          jsonPath: "{$.decision}"
          timeoutSeconds: 10
    - name: candidate-error-burn
      interval: 1m
      count: 15
      failureLimit: 1
      successCondition: len(result) == 0 || result[0] < 14.4
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          query: |
            (
              sum(rate(bellwether_gateway_requests_total{route="candidate",version="{{args.candidate-version}}",code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(bellwether_gateway_requests_total{route="candidate",version="{{args.candidate-version}}"}[5m])), 1e-12)
            ) / 0.001
