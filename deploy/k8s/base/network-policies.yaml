# Default deny inside the namespace, then open only the paths the design uses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modelserver-from-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: modelserver }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analyzer-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: analyzer }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: argo-rollouts }
      ports:
        - { port: 8010 }
        - { port: 50051 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: gateway }
  ingress:
    - ports:
        - { port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 9091 }
