global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:9091"] }]
  - job_name: analyzer
    static_configs: [{ targets: ["analyzer:8010"] }]
  - job_name: modelserver
    static_configs: [{ targets: ["model-v1:8000", "model-candidate:8000"] }]
